[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "leadflow-ai"
version = "0.1.0"
description = "Inbound lead triage automation: validate, classify with an LLM (structured output), route, persist, notify."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic[email]>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
sheets = ["gspread>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
leadflow = "leadflow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leadflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Newer Starlette prefers httpx2 for TestClient; httpx still works and is what we pin.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "S"]
ignore = ["PLR0911", "PLR0913", "PLR2004", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["anthropic", "openai", "gspread"]
ignore_missing_imports = true
