services:
  leadflow:
    build:
      context: .
      args:
        EXTRAS: "${LEADFLOW_EXTRAS:-}"
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - leadflow-data:/app/out

  n8n:
    # Pin to the n8n version you run in production.
    image: docker.n8n.io/n8nio/n8n:1.88.0
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      - leadflow

volumes:
  leadflow-data:
  n8n-data:
